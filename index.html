<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send a Message</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       CONFIGURATION — paste your Discord webhook URL below
       ============================================================ */
    /* See the JS section at the bottom */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --discord: #5865F2;
      --discord-dark: #4752C4;
      --bg: #0e0f13;
      --surface: #16181f;
      --surface2: #1e2028;
      --border: rgba(255,255,255,0.07);
      --text: #f0f0f0;
      --muted: #7c7f8e;
      --green: #57F287;
      --red: #ED4245;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(88,101,242,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88,101,242,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(88,101,242,0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* header */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeDown 0.5s ease both;
    }

    .discord-logo {
      width: 52px;
      height: 52px;
      background: var(--discord);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .discord-logo svg { width: 30px; height: 30px; fill: white; }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.03em;
    }

    /* card */
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeUp 0.5s ease 0.1s both;
    }

    .username-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--discord);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .name-tag {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .display-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .handle {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 90px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      color: var(--text);
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    textarea::placeholder { color: var(--muted); }

    textarea:focus {
      border-color: rgba(88,101,242,0.5);
      box-shadow: 0 0 0 3px rgba(88,101,242,0.1);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .char-count {
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      transition: color 0.2s;
    }

    .char-count.warn { color: #faa61a; }
    .char-count.over { color: var(--red); }

    .send-btn {
      background: var(--discord);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      opacity: 0.4;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .send-btn svg { width: 15px; height: 15px; fill: white; }

    .send-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .send-btn.active:hover { background: var(--discord-dark); }
    .send-btn.active:active { transform: scale(0.97); }
    .send-btn.loading { opacity: 0.7; pointer-events: none; }

    /* toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
      opacity: 0;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success { border-color: rgba(87,242,135,0.3); color: var(--green); }
    .toast.error { border-color: rgba(237,66,69,0.3); color: var(--red); }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* webhook warning banner */
    .warning {
      width: 100%;
      background: rgba(250,166,26,0.08);
      border: 1px solid rgba(250,166,26,0.2);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #faa61a;
      line-height: 1.5;
      animation: fadeUp 0.5s ease 0.2s both;
      display: none;
    }

    .warning strong { font-weight: 600; }

    .warning code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: rgba(250,166,26,0.15);
      padding: 1px 5px;
      border-radius: 4px;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="glow"></div>

<div class="container">
  <div class="header">
    <div class="discord-logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
    </div>
    <h1>Post directly to <a href="https://discord.gg/ExPq29gHh" target="_blank" rel="noopener" style="color:#5865F2;text-decoration:none;border-bottom:2px solid rgba(88,101,242,0.4);padding-bottom:1px;">The Floob Server</a></h1>
    <span class="subtitle">→ your message goes straight to the channel</span>
  </div>

  <div class="warning" id="warning">
    <strong>Setup required:</strong> Open this file and find the line near the bottom that says<br>
    <code>const WEBHOOK_URL = "";</code> — paste your Discord webhook URL between the quotes.
  </div>

  <div class="card">
    <div class="username-row">
      <div class="avatar" id="av">?</div>
      <div class="name-tag">
        <span class="display-name" id="display-name">Anonymous</span>
        <span class="handle" id="handle">configure webhook to post</span>
      </div>
    </div>

    <textarea id="msg" placeholder="Type a message..." maxlength="2000"></textarea>

    <div class="row">
      <span class="char-count" id="count">0 / 2000</span>
      <button class="send-btn" id="send-btn">
        <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2z"/></svg>
        Send
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <div class="dot"></div>
  <span id="toast-msg">Sent!</span>
</div>

<script>
  // ============================================================
  //  PASTE YOUR DISCORD WEBHOOK URL HERE (between the quotes)
  // ============================================================
  const WEBHOOK_URL = "https://discord.com/api/webhooks/1508641545249624086/OER6q1UYiGwn0ascZtu5loOtYybAN15VlDD4rNBV28GBDlb7zE0loWQ3l-H6uykX9UN2";

  // Optional: change the sender name and avatar letter shown on the site
  const SENDER_NAME = "Anonymous";
  const AVATAR_LETTER = "A";
  // ============================================================

  const msg = document.getElementById('msg');
  const sendBtn = document.getElementById('send-btn');
  const countEl = document.getElementById('count');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toast-msg');
  const warning = document.getElementById('warning');
  const av = document.getElementById('av');
  const displayName = document.getElementById('display-name');
  const handle = document.getElementById('handle');

  av.textContent = AVATAR_LETTER;
  displayName.textContent = SENDER_NAME;

  if (!WEBHOOK_URL) {
    warning.style.display = 'block';
    handle.textContent = 'webhook not configured';
  } else {
    handle.textContent = 'ready to post';
  }

  msg.addEventListener('input', () => {
    const len = msg.value.length;
    countEl.textContent = len + ' / 2000';
    countEl.className = 'char-count' + (len >= 2000 ? ' over' : len >= 1800 ? ' warn' : '');
    sendBtn.className = 'send-btn' + (len > 0 && len <= 2000 && WEBHOOK_URL ? ' active' : '');
  });

  msg.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (sendBtn.classList.contains('active')) sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage() {
    const text = msg.value.trim();
    if (!text || !WEBHOOK_URL) return;

    sendBtn.className = 'send-btn loading';
    sendBtn.querySelector('span') && null;

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: SENDER_NAME,
          content: text
        })
      });

      if (res.ok || res.status === 204) {
        msg.value = '';
        countEl.textContent = '0 / 2000';
        countEl.className = 'char-count';
        showToast('Message sent to Discord!', 'success');
      } else {
        showToast('Failed to send. Check your webhook URL.', 'error');
      }
    } catch (err) {
      showToast('Network error. Try again.', 'error');
    }

    sendBtn.className = 'send-btn';
  }

  function showToast(message, type) {
    toastMsg.textContent = message;
    toast.className = 'toast ' + type;
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => toast.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
